[project]
name = "sqs-consumer"
version = "0.2.0"
description = "Build Amazon SQS-based applications without the boilerplate."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "boto3>=1.34,<2",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.uv.build-backend]
module-name = "sqs_consumer"
module-root = ""

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.taskipy.tasks]
format = "uv run ruff format . && uv run ruff check . --fix"
lint = "uv run ruff format ./sqs_consumer ./tests --check && uv run ruff check ./sqs_consumer ./tests"
typecheck = "uv run mypy ./sqs_consumer ./tests"
test = "uv run task lint && uv run task typecheck && uv run pytest -vv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
consider_namespace_packages = true
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "boto3-stubs[sqs]==1.43.118",
    "moto[sqs]==5.2.4",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
    "taskipy==1.14.1",
    "testcontainers==4.15.0",
    "types-docker==7.2.0.20261006",
]
